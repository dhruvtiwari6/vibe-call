version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vibe-call-app
    restart: always
    ports:
      - "3000:3000"
      - "40000-40100:40000-40100/udp"
      - "40000-40100:40000-40100/tcp"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/vibecall?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-xTKUQWO0caJ2oqIhHPcxRANm9IMpsBz8X+2gOi9bUKo=}
      - AUTH_GITHUB_ID=${AUTH_GITHUB_ID}
      - AUTH_GITHUB_SECRET=${AUTH_GITHUB_SECRET}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - NEXT_PUBLIC_SOCKET_PORT=3000
      - NEXT_PUBLIC_SOCKET_URL=${NEXT_PUBLIC_SOCKET_URL:-http://localhost:3000}
      - NEXT_PUBLIC_API_CHATS_RECENT=${NEXT_PUBLIC_API_CHATS_RECENT:-/api/chats/recent}
      - NEXT_PUBLIC_API_IMAGE_UPLOAD=${NEXT_PUBLIC_API_IMAGE_UPLOAD:-/api/image_upload}
      - NEXT_PUBLIC_API_USER_SEARCH=${NEXT_PUBLIC_API_USER_SEARCH:-/api/user/search}
      - NEXT_PUBLIC_API_CHAT_ADD_REMOVE=${NEXT_PUBLIC_API_CHAT_ADD_REMOVE:-/api/chats/Add_Remove}
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:15-alpine
    container_name: vibe-call-db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=vibecall
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: vibe-call-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
